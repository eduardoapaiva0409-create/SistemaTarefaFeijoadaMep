name: Auto-merge

# Liga o auto-merge do PR assim que ele abre (ou reabre). O merge em si NÃO
# acontece aqui — o GitHub só executa quando a proteção do branch `main`
# reportar o check "build" (ci.yml) verde. PR rascunho fica de fora: ainda
# não é para subir.
on:
  pull_request:
    types: [opened, reopened, ready_for_review]
    branches: [main]

permissions:
  pull-requests: write
  contents: write

jobs:
  habilitar:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - run: gh pr merge --auto --squash --delete-branch "$PR_URL"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
